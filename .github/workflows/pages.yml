name: Deploy Web (GitHub Pages)

# เผยแพร่ตัวเกม (www/) ขึ้น GitHub Pages ทุกครั้งที่แก้โค้ดเกม
# แอป (APK) โหลดหน้านี้ตอนเปิด → แก้เกมแล้ว push = แอปอัปเดตเอง ไม่ต้องลง APK ใหม่
on:
  push:
    branches: [ "**" ]
    paths:
      - "game.js"
      - "index.html"
      - "download.html"
      - "manifest.webmanifest"
      - "phaser.min.js"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate game and UI contracts
        run: npm run check
      - name: Assemble web assets (www/)
        run: node scripts/build-www.mjs && node scripts/build-forge-review.mjs && node scripts/build-lobby-review.mjs
      - name: Verify Forge menu visuals
        run: |
          npm install --prefix /tmp/forge-browser --no-save playwright@1.51.1
          /tmp/forge-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/forge-browser/node_modules node scripts/check-forge-live-ui.cjs
          NODE_PATH=/tmp/forge-browser/node_modules node scripts/check-lobby-live-ui.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Forge
        env:
          FORGE_DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const fs=require('fs');
          const expected=fs.readFileSync('game.js','utf8').match(/const GAME_VERSION = '([^']+)'/)[1];
          const base=process.env.FORGE_DEPLOY_URL;
          if(!base)throw Error('Missing deployment URL');
          async function get(rel){const url=new URL(rel,base);url.searchParams.set('verify',process.env.GITHUB_SHA);const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error(url.pathname+' HTTP '+r.status);return r;}
          (async()=>{let last;for(let i=0;i<6;i++){try{
            const version=await (await get('version.json')).json();
            if(version.version!==expected)throw Error('Live version '+version.version+' != '+expected);
            const game=await (await get('game.js')).text();
            if(!game.includes("const GAME_VERSION = '"+expected+"'")||!game.includes('assets/art/forge_ui/atlas.png'))throw Error('Live Forge code is stale');
            const atlas=new Uint8Array(await (await get('assets/art/forge_ui/atlas.png')).arrayBuffer());
            if(![137,80,78,71,13,10,26,10].every((v,j)=>atlas[j]===v))throw Error('Live atlas is not PNG');
            console.log('Live Forge verified: v'+expected+'; published code and production atlas match');return;
          }catch(e){last=e;if(i<5)await new Promise(r=>setTimeout(r,5000));}}throw last;})().catch(e=>{console.error(e);process.exitCode=1;});
          JS
