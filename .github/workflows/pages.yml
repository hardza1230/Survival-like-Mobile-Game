name: Deploy Web (GitHub Pages)

# เผยแพร่ตัวเกม (www/) ขึ้น GitHub Pages ทุกครั้งที่แก้โค้ดเกม
# แอป (APK) โหลดหน้านี้ตอนเปิด → แก้เกมแล้ว push = แอปอัปเดตเอง ไม่ต้องลง APK ใหม่
on:
  push:
    branches: [ "**" ]
    paths:
      - "game.js"
      - "index.html"
      - "download.html"
      - "manifest.webmanifest"
      - "phaser.min.js"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate game and UI contracts
        run: npm run check
      - name: Assemble web assets (www/)
        run: node scripts/build-www.mjs && node scripts/build-forge-review.mjs
      - name: Verify Forge menu visuals
        run: |
          npm install --prefix /tmp/forge-browser --no-save playwright@1.51.1
          /tmp/forge-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/forge-browser/node_modules node scripts/check-forge-live-ui.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
