name: Deploy Web (GitHub Pages)

# เผยแพร่ตัวเกม (www/) ขึ้น GitHub Pages ทุกครั้งที่แก้โค้ดเกม
# แอป (APK) โหลดหน้านี้ตอนเปิด → แก้เกมแล้ว push = แอปอัปเดตเอง ไม่ต้องลง APK ใหม่
on:
  push:
    # v8.1.74: เฉพาะสาขาที่ขึ้นเกม (Pages env รับสาขานี้สาขาเดียว) · เดิม "**" ทำให้ push สาขา session ไปยกเลิกรอบขึ้นเกม (concurrency cancel-in-progress)
    branches: [ "claude/vampire-survival-mobile-game-yo9e8w" ]
    paths:
      - "game.js"
      - "index.html"
      - "download.html"
      - "manifest.webmanifest"
      - "phaser.min.js"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "sw.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04   # ubuntu-latest = 26.04: Playwright 1.51.1 cannot install Chromium there
    steps:
      # v8.1.74: repo > 2 GB (assets/incoming = ไฟล์ต้นฉบับจากฝั่งอาร์ต/เสียง) · ข้ามเฉพาะไฟล์ที่ไม่มีเทสไหนอ่าน (ตรวจด้วย fs log ทั้ง npm run check + check-*.cjs)
      # ถ้าเทสใหม่ต้องอ่านไฟล์ในกลุ่มนี้ ให้ลบแพตเทิร์นนั้นออก
      - uses: actions/checkout@v4
        timeout-minutes: 15
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/incoming/**/candidates/
            !/assets/incoming/**/donors/
            !/assets/incoming/**/*.gif
            !/assets/incoming/**/*.jpg
            !/assets/incoming/**/*preview*
            !/assets/incoming/lobby_hero_motion/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install audio validation dependency
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null; then
            npm install --prefix /tmp/mochi-ffmpeg --no-save --ignore-scripts --no-audit --no-fund @ffmpeg-installer/linux-x64@4.1.0
            ffmpeg_bin=/tmp/mochi-ffmpeg/node_modules/@ffmpeg-installer/linux-x64
            "$ffmpeg_bin/ffmpeg" -version
            echo "$ffmpeg_bin" >> "$GITHUB_PATH"
          fi
      # v8.1.142: deploy gate = contract tests + build (~20 s) · browser UI checks run in the parallel "visual" job below
      # (same script locally before every release: bash scripts/ci-checks.sh)
      - name: Validate game contracts and assemble www/
        run: bash scripts/ci-checks.sh fast
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1200000

      - name: Verify published Forge
        env:
          FORGE_DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const fs=require('fs');
          const expected=fs.readFileSync('game.js','utf8').match(/const GAME_VERSION = '([^']+)'/)[1];
          const base=process.env.FORGE_DEPLOY_URL;
          if(!base)throw Error('Missing deployment URL');
          async function get(rel){const url=new URL(rel,base);url.searchParams.set('verify',process.env.GITHUB_SHA);const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error(url.pathname+' HTTP '+r.status);return r;}
          (async()=>{let last;for(let i=0;i<6;i++){try{
            const version=await (await get('version.json')).json();
            if(version.version!==expected)throw Error('Live version '+version.version+' != '+expected);
            const game=await (await get('game.js')).text();
            if(!game.includes("const GAME_VERSION = '"+expected+"'")||!game.includes('assets/art/forge_ui/atlas.webp'))throw Error('Live Forge code is stale');
            const atlas=new Uint8Array(await (await get('assets/art/forge_ui/atlas.webp')).arrayBuffer());
            if(String.fromCharCode(...atlas.slice(0,4))!=='RIFF'||String.fromCharCode(...atlas.slice(8,12))!=='WEBP')throw Error('Live atlas is not WebP');   // v8.1.139 runtime art is WebP
            console.log('Live Forge verified: v'+expected+'; published code and production atlas match');return;
          }catch(e){last=e;if(i<5)await new Promise(r=>setTimeout(r,5000));}}throw last;})().catch(e=>{console.error(e);process.exitCode=1;});
          JS

  # v8.1.142: browser UI contract checks in parallel (2–3 min) — they no longer hold the deploy back.
  # A red "visual" job means a UI contract broke: fix it in the next release.
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/incoming/**/candidates/
            !/assets/incoming/**/donors/
            !/assets/incoming/**/*.gif
            !/assets/incoming/**/*.jpg
            !/assets/incoming/**/*preview*
            !/assets/incoming/lobby_hero_motion/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Browser UI checks
        env:
          FORGE_BROWSER_CHANNEL: chrome
        run: |
          npm install --prefix /tmp/forge-browser --no-save playwright@1.51.1
          NODE_PATH=/tmp/forge-browser/node_modules bash scripts/ci-checks.sh visual
