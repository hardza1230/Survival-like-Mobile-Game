name: Release Signed AAB

# สร้าง Android App Bundle (.aab) ที่เซ็นด้วย release keystore สำหรับอัปขึ้น Play Store
# ทริกเกอร์: กด Run เอง (workflow_dispatch) หรือ push tag v* (เช่น v3.0.0)
# ต้องตั้ง GitHub Secrets ก่อน (ดู docs/RELEASE_SIGNING.md):
#   KEYSTORE_BASE64 · KEYSTORE_PASSWORD · KEY_ALIAS · KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install

      - name: Assemble web assets (www/)
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons (launcher + adaptive)
        run: npx capacitor-assets generate --android --assetPath resources

      - name: Force portrait and fullscreen
        run: node scripts/set-android-landscape.mjs

      - name: Inject release signing config
        run: node scripts/inject-signing.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret KEYSTORE_BASE64 — ดู docs/RELEASE_SIGNING.md"; exit 1;
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "keystore decoded ($(stat -c%s android/app/release.keystore) bytes)"

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Locate AAB
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab mochi-mayhem-release.aab
          echo "AAB size: $(stat -c%s mochi-mayhem-release.aab) bytes"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochi-mayhem-release-aab
          path: mochi-mayhem-release.aab
          if-no-files-found: error

      - name: Attach AAB to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mochi-mayhem-release.aab
