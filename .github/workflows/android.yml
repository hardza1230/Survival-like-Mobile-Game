name: Build Android APK

# build เมื่อ push โค้ดเกม, กดรันเอง (Run workflow), หรือ push tag v* (ออกเป็น Release)
on:
  push:
    branches: [ "**" ]
    paths:
      - "game.js"
      - "index.html"
      - "phaser.min.js"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android.yml"
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write   # ให้สร้าง Release ตอน push tag ได้

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Assemble web assets (www/)
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mochi-mayhem-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochi-mayhem-debug-apk
          path: mochi-mayhem-debug.apk
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mochi-mayhem-debug.apk
