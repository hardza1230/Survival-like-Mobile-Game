<style>
  /* v7.8.98 portrait only: touch devices in landscape see a rotate prompt (desktop unaffected) */
  #rotate-lock{position:fixed;inset:0;z-index:2147483000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#241d2e;color:#fff4e8;font:600 18px/1.4 system-ui,sans-serif;text-align:center;padding:24px}
  #rotate-lock.on{display:flex}
  #rotate-lock .ph{width:46px;height:78px;border:4px solid #ffd166;border-radius:10px;animation:rl-turn 1.6s ease-in-out infinite}
  @keyframes rl-turn{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
  @media (prefers-reduced-motion: reduce){#rotate-lock .ph{animation:none}}

  @font-face{font-family:NunitoUI;src:url('assets/fonts/NunitoUI-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:NunitoUI;src:url('assets/fonts/NunitoUI-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#241d2e;
    touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;
    display:block!important;margin:0!important;padding:0!important;touch-action:none;background:#241d2e;
    image-rendering:auto;}
  *{-webkit-tap-highlight-color:transparent;}
  /* The canvas and loader share one portrait frame on wide displays. */
  .portrait-fit canvas,.portrait-fit #game-loader{left:calc(50% - 28.125vh)!important;right:auto!important;width:56.25vh!important;}
  .portrait-fit #game-loader .k-stage{width:56.25vh!important;}
  @media (min-aspect-ratio:1/1), (hover:hover) and (pointer:fine) and (min-aspect-ratio:62/100){
    #game-loader{left:calc(50% - 28.125vh)!important;right:auto!important;width:56.25vh!important;}
    #game-loader .k-stage{width:56.25vh!important;}
  }
  #err-box{position:fixed;bottom:20px;left:20px;right:20px;z-index:10000;display:none;background:rgba(30,15,35,0.95);border:2px solid #ff5a7a;border-radius:14px;padding:16px;color:#fff;font-family:sans-serif;text-align:center;}
  #err-box button{margin-top:10px;padding:8px 16px;background:#66d3b3;border:none;border-radius:8px;font-weight:bold;color:#12331f;cursor:pointer;}
  #game-loader{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(circle at 50% 34%,#5c3a58 0,#33273f 46%,#1d1626 100%);
    color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;transition:opacity .22s ease;}
  #game-loader .card{position:relative;width:min(78%,360px);text-align:center;box-sizing:border-box;padding:16px 20px !important;}
  #game-loader .status{min-height:23px;margin-top:0;font-size:15px;color:#f5e8f0;}
  #game-loader .track{height:7px;margin-top:16px;padding:0;border-radius:999px;background:#17121e;overflow:hidden;position:relative;
    box-shadow:inset 0 1px 2px #0004,0 0 0 1px #ffffff15;}
  #game-loader .track:after{display:none}
  #game-loader .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#91d9c2,#e8dab4);
    box-shadow:none;transition:width .18s ease;}
  #game-loader .status{white-space:pre-line;}
  #load-cover{display:none;position:absolute;inset:0;z-index:0;background:#120d18;} #load-cover img{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(92vw,420px);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.6);opacity:.95;} #load-cover-title{position:absolute;left:0;right:0;top:calc(42% + min(46vw,210px) + 12px);text-align:center;font:700 20px sans-serif;color:#ffe6f1;text-shadow:0 2px 6px #000;} #game-loader.stage-cover #load-cover{display:block;} #game-loader.stage-cover .card{position:absolute;bottom:9vh;z-index:1;} #game-loader.stage-cover .kitchen{display:none;}   /* v8.2.83 หน้าโหลดเข้าด่าน: ภาพปกด่าน + Tip */
  #game-loader .percent{margin-top:8px;font-size:13px;font-weight:500;color:#d2c8d8;}

  /* Selected-stage transition, painted twelve-frame loop; no WebGL texture allocation. */
  #load-portal{display:none;position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(72%,280px,39vh);aspect-ratio:1;background-image:url('assets/art/entry/transition836.webp');background-size:400% 300%;background-position:0 0;mask-image:radial-gradient(closest-side,#000 83%,transparent);animation:seed-portal 1.44s steps(1,end) infinite;}
  #game-loader.stage-cover #load-portal{display:block;}
  #game-loader.stage-cover{background:#261e30;}
  #game-loader.stage-cover #load-cover-img{left:0;top:0;transform:none;width:100%;height:100%;object-fit:cover;filter:blur(15px);opacity:.14;border-radius:0;box-shadow:none;}
  #game-loader.stage-cover #load-cover-title{top:63%;font-size:20px;padding:0 18px;box-sizing:border-box;}
  #game-loader.stage-cover .card{width:min(88%,400px);bottom:7vh;}
  #load-phase{display:none;margin-bottom:12px;color:#f2d49e;font:600 14px sans-serif;}
  #game-loader.stage-cover #load-phase{display:block;}
  #load-recovery{display:none;margin-top:14px;color:#fce5e0;font:14px/1.5 sans-serif;}
  #game-loader.load-error #load-recovery{display:block;}
  #game-loader.load-error #load-portal{animation-play-state:paused;opacity:.4;}
  #load-recovery button{min-height:44px;border:1px solid #b7a8bf;border-radius:10px;padding:9px 18px;margin:5px;background:#382b42;color:#fff;font-weight:700;cursor:pointer;}
  #load-retry{background:#f1c86b!important;color:#342116!important;border-color:#ffdf8e!important;}
  @keyframes seed-portal{0.0%{background-position:0.0% 0%;}8.33333%{background-position:33.333333333333336% 0%;}16.66667%{background-position:66.66666666666667% 0%;}25.0%{background-position:100.0% 0%;}33.33333%{background-position:0.0% 50%;}41.66667%{background-position:33.333333333333336% 50%;}50.0%{background-position:66.66666666666667% 50%;}58.33333%{background-position:100.0% 50%;}66.66667%{background-position:0.0% 100%;}75.0%{background-position:33.333333333333336% 100%;}83.33333%{background-position:66.66666666666667% 100%;}91.66667%{background-position:100.0% 100%;}100%{background-position:0% 0%;}}
  @media(prefers-reduced-motion:reduce){#load-portal{animation:none;}}
</style>
<script>
  window.GameLoader = {
    TIPS:['Dash out of a red circle at the last moment for a Perfect Dodge!','Big missions are optional chaos — the stage moves on when the main goal is done.','Bosses change tactics at 60% and 30% HP — watch for the warning.','Each stage remembers your best stars — come back stronger for 3 stars.','Dash makes you briefly invincible — dash through enemy attacks.','Red circles on the ground explode — step out fast.','Pick cards that boost your main attack early.','Elites drop more EXP and loot — hunt them down.','Grab hearts when HP is low; magnets pull in every EXP orb.','Your Unique skill charges over time — save it for bosses.','Higher difficulty gives better rewards.','Spend Sugar in the Temple to grow stronger between runs.','Keep moving — standing still lets the swarm surround you.','Watch the mission text above your hero to know what to do.'],
    _introDone:false,
    _introFinished:false,
    _introTimer:null,
    _revealTimer:null,
    _shownAt:performance.now(),
    finishIntro:function(){
      var root=document.getElementById('game-loader');if(!root)return;
      clearTimeout(this._introTimer);this._introTimer=null;
      root.style.opacity='0';root.style.pointerEvents='none';
      setTimeout(function(){if(root.style.opacity==='0')root.style.display='none';root.classList.remove('opening','intro-mode');},240);
      this._introFinished=true;this.lightOn();window.dispatchEvent(new Event('mochi-intro-finished'));
    },
    // แสงกลางจอเริ่มโผล่ (48% ของฉากเปิด) → เริ่มเพลงเมนูได้
    lightOn:function(){if(this._lightOn)return;this._lightOn=true;window.dispatchEvent(new Event('mochi-intro-light'));},
    skipIntro:function(){var root=document.getElementById('game-loader');if(this._introDone&&root&&root.classList.contains('opening'))this.finishIntro();},
    stageCover:function(url,title){var root=document.getElementById('game-loader'),img=document.getElementById('load-cover-img'),tt=document.getElementById('load-cover-title');if(!root||!img)return;this._stageActive=!!url;if(url){img.src=url;root.classList.add('stage-cover');this._minUntil=performance.now()+800;}else root.classList.remove('stage-cover');if(tt)tt.textContent=title||'';},
    clearError:function(){var root=document.getElementById('game-loader');if(root)root.classList.remove('load-error');for(var id of ['load-retry','load-back']){var button=document.getElementById(id);if(button)button.onclick=null;}},
    stageProgress:function(loaded,total,label){this.set(total?loaded/total:1,label);var pct=document.getElementById('load-percent');if(pct)pct.textContent=loaded+' / '+total+' artwork · '+Math.round(total?loaded/total*100:100)+'%';},
    error:function(message,retry,back){this.show('Waiting for artwork…');var root=document.getElementById('game-loader'),text=document.getElementById('load-error-text'),r=document.getElementById('load-retry'),b=document.getElementById('load-back'),me=this;if(root)root.classList.add('load-error');if(text)text.textContent=message;if(r)r.onclick=function(){me.clearError();retry();};if(b)b.onclick=function(){me.clearError();back();};r?.focus?.();},
    show:function(label,progress){
      var root=document.getElementById('game-loader');
      if(!root)return;this.clearError();
      var visibilityToken=this._visibilityToken=(this._visibilityToken||0)+1,me=this;
      root.style.display='flex'; root.style.pointerEvents='auto';
      if(!this._shownAt)this._shownAt=performance.now();
      root.classList.toggle('intro-mode',!this._introDone); root.classList.toggle('loading-mode',this._introDone); root.classList.remove('opening');
      requestAnimationFrame(function(){if(me._visibilityToken===visibilityToken)root.style.opacity='1';});
      this.set(progress == null ? 0 : progress,label);
    },
    set:function(progress,label){
      var fill=document.getElementById('load-fill'), pct=document.getElementById('load-percent');
      var status=document.getElementById('load-status');
      var p=Math.max(0,Math.min(1,Number(progress)||0));
      if(fill)fill.style.width=Math.round(p*100)+'%';
      if(pct)pct.textContent=Math.round(p*100)+'%';
      if(status&&!this._tipT){var T=this.TIPS,me=this,i=Math.floor(Math.random()*T.length);status.textContent='💡 '+T[i];this._tipT=setInterval(function(){i=(i+1)%T.length;var el=document.getElementById('load-status');if(el)el.textContent='💡 '+T[i];},4000);}
    },
    hide:function(){this.clearError();var wait=(this._minUntil||0)-performance.now();if(wait>0){var me=this;clearTimeout(this._minT);this._minT=setTimeout(function(){me._minUntil=0;me.hide();},wait);return;}   /* v8.2.83 หน้าโหลดเข้าด่านโชว์อย่างน้อย 0.8 วิ */
      this._visibilityToken=(this._visibilityToken||0)+1;clearInterval(this._tipT);this._tipT=null;var rc=document.getElementById('game-loader');if(rc)setTimeout(function(){if(rc.style.opacity==='0'){rc.classList.remove('stage-cover');window.GameLoader._stageActive=false;}},260);
      var root=document.getElementById('game-loader');
      if(!root)return;
      if(!this._introDone && root.classList.contains('intro-mode')){
        this._introDone=true;
        var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var begin=()=>{root.classList.add('opening');this._introTimer=setTimeout(()=>this.finishIntro(),reduced?180:9400);setTimeout(()=>this.lightOn(),reduced?0:4500);};
        // Let the three lamps light in order even when the assets load quickly.
        var remaining=reduced?0:Math.max(0,3300-(performance.now()-(this._shownAt||performance.now())));
        clearTimeout(this._revealTimer);
        this._revealTimer=setTimeout(begin,remaining);
        return;
      }
      root.style.opacity='0'; root.style.pointerEvents='none';
      setTimeout(function(){ if(root.style.opacity==='0')root.style.display='none'; },240);
    }
  };
  // เพลงหน้าโหลด = bgm_title (v8.1.35 เจ้าของ: ใช้เพลงที่ 2 ทั้งหมด เล่นต่อเนื่องถึงหน้า title) — เคารพปิดเสียง/ระดับเพลงในเซฟ · เบราว์เซอร์บล็อก autoplay ได้ → ลองเล่นใหม่ตอนแตะครั้งแรก
  window.LoaderMusic=(function(){var a=null,stopped=false,vol=0.32;
    try{var sv=JSON.parse(localStorage.getItem('mochi_save')||'{}'),st=sv.settings||{};if(st.sound===false)stopped=true;if(st.musicVol!=null)vol*=st.musicVol;}catch(e){}
    function play(){if(stopped)return;try{if(!a){a=new Audio('assets/audio/story_music/bgm_title.mp3');a.loop=true;a.volume=vol;}var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
    function stop(){if(stopped)return;stopped=true;if(!a)return;var v=a.volume,t=setInterval(function(){v-=0.04;if(v<=0){clearInterval(t);a.pause();}else a.volume=v;},60);}
    play();window.addEventListener('pointerdown',play,{once:true,capture:true});window.addEventListener('touchstart',play,{once:true,capture:true,passive:true});
    return {play:play,stop:stop,playing:function(){return !stopped&&!!a&&!a.paused;}};})();
  window.addEventListener('error', function(e){
    var box = document.getElementById('err-box');
    var txt = document.getElementById('err-msg');
    if(box && txt){
      box.style.display = 'block';
      txt.textContent = 'Error: ' + (e.message || e);
    }
  });
  window.addEventListener('unhandledrejection',function(e){
    var box=document.getElementById('err-box'), txt=document.getElementById('err-msg');
    if(box&&txt){ box.style.display='block'; txt.textContent='Could not start the game: '+((e.reason&&e.reason.message)||e.reason||'please try again'); }
  });
  function clearCacheAndReload(){
    if('caches' in window){ caches.keys().then(function(names){ return Promise.all(names.map(function(n){return caches.delete(n);})); }).finally(function(){window.location.reload();}); }
    else window.location.reload();
  }
  window.enterGameFullscreen=function(){
    try{
      var root=document.documentElement;
      if(!document.fullscreenElement&&root.requestFullscreen)root.requestFullscreen({navigationUI:'hide'}).catch(function(){});
      var o=screen.orientation;if(o&&o.lock)o.lock('portrait').catch(function(){});
    }catch(e){}
  };
  window.addEventListener('pointerdown',window.enterGameFullscreen,{once:true,capture:true});
  window.addEventListener('touchstart',window.enterGameFullscreen,{once:true,capture:true,passive:true});
</script>
</head>
<body>
<div id="game-loader" class="intro-mode" role="status" aria-live="polite">
  <div class="kitchen" aria-hidden="true"><div class="k-stage">
    <div class="k-plate"></div><div class="k-clouds"></div>
    <div class="k-lamp a"></div><div class="k-lamp b"></div><div class="k-lamp c"></div><div class="k-warm"></div>
    <div class="k-oven"></div><div class="k-steam"><i style="--sx:11%;--delay:-.2s"></i><i style="--sx:39%;--delay:-1.2s"></i><i style="--sx:67%;--delay:-2.2s"></i></div>
    <div class="k-curtain left"></div><div class="k-curtain right"></div><div class="k-jar-glint"></div>
    <div class="k-motes"></div><div class="k-bloom"></div><div class="k-shade"></div>
  </div>
    <div class="k-world"><div class="k-city"></div><div class="k-flowers"></div>
      <div class="k-petals"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="k-transition-light"></div><div class="k-menu-light"></div>
  </div>
  <button id="entry-skip" type="button" onclick="window.GameLoader.skipIntro()">Skip intro ›</button>
  <div id="load-cover" aria-hidden="true"><img id="load-cover-img" alt=""><div id="load-portal"></div><div id="load-cover-title"></div></div>
  <div class="card">
    <div id="load-phase">Preparing stage artwork…</div>
    <div class="status" id="load-status">💡 Keep moving — standing still lets the swarm surround you.</div>
    <div class="track"><div class="fill" id="load-fill"></div></div>
    <div class="percent" id="load-percent">0%</div>
    <div id="load-recovery" role="alert"><p id="load-error-text"></p><button id="load-retry" type="button">Try again</button><button id="load-back" type="button">Back</button></div>
  </div>
</div>
<div id="err-box">
  <div id="err-msg">Something went wrong while loading the game</div>
  <button onclick="clearCacheAndReload()">↻ Clear cache and reload</button>
</div>
<!-- Supabase JS SDK (cloud save) — โหลดจาก CDN · ถ้าโหลดไม่ได้เกมยังเล่นได้ (เซฟ localStorage) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.assetCacheReady=Promise.resolve();if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.assetCacheReady=navigator.serviceWorker.register('sw.js').then(function(){if(navigator.serviceWorker.controller)return;return new Promise(function(resolve){navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true});setTimeout(resolve,3000);});}).catch(function(){});try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}</script>
<script src="phaser.min.js"></script>
<script>
  // โหลด game.js แบบกันแคชค้าง (WebView/Pages เคยเสิร์ฟไฟล์เก่า)
  (function(){
    var s=document.createElement('script');
    s.src='game.js?v='+Date.now();
    s.onerror=function(){ var b=document.getElementById('err-box'); if(b)b.style.display='block'; };
    var ready=document.fonts?Promise.all([document.fonts.load('700 24px NunitoUI'),document.fonts.load('400 16px NunitoUI')]):Promise.resolve();
    // v7.8.104 เวอร์ชันใหม่ขึ้นตั้งแต่เปิดครั้งแรก: ถาม version.json (เล็ก) ก่อน · ถ้าไม่ตรงกับตัวที่โหลดล่าสุด → ขอ game.js แบบ fresh (SW รอเน็ตจนจบ ไม่ตัด 3.5 วิ แล้วยื่นของเก่า)
    var ver=new Promise(function(resolve){ try{ var done=false,t=setTimeout(function(){if(!done){done=true;resolve(null);}},2500);
      fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){if(!done){done=true;clearTimeout(t);resolve(j&&j.version);}}).catch(function(){if(!done){done=true;clearTimeout(t);resolve(null);}}); }catch(e){resolve(null);} });
    Promise.all([Promise.race([ready,new Promise(function(resolve){setTimeout(resolve,1500);})]).catch(function(){}),ver,window.assetCacheReady]).then(function(r){ var v=r[1],last=null; try{last=localStorage.getItem('mochi_last_ver');}catch(e){}
      if(v&&v!==last){ s.src+='&fresh='+encodeURIComponent(v); try{ if(window.GameLoader&&window.GameLoader.show)window.GameLoader.show('Updating to v'+v+'…',0.2); }catch(e){} }
      document.body.appendChild(s); });
  })();
</script>
<script>
  (function(){ try{ window.enterGameFullscreen(); }catch(e){} })();
</script>
<div id="rotate-lock" aria-live="polite"><div class="ph"></div><div>Please turn your phone upright</div><div style="font-weight:400;font-size:14px;opacity:.75">Mochi Mayhem plays in portrait only</div></div>
<script>
(function(){
  var el=document.getElementById('rotate-lock'),slept=false;
  function touch(){ try{ return window.matchMedia('(pointer: coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0); }catch(e){ return false; } }
  function check(){
    var land=window.innerWidth>window.innerHeight&&touch(),g=window.__g;
    el.classList.toggle('on',land);
    try{ if(g&&g.loop){ if(land&&!slept){ g.loop.sleep(); slept=true; } else if(!land&&slept){ g.loop.wake(); slept=false; } } }catch(e){}
    try{ var o=screen.orientation; if(land&&o&&o.lock)o.lock('portrait').catch(function(){}); }catch(e){}
  }
  window.addEventListener('resize',check); window.addEventListener('orientationchange',function(){ setTimeout(check,120); });
  document.addEventListener('DOMContentLoaded',check); setTimeout(check,500); setInterval(function(){ if(el.classList.contains('on'))check(); },1500);
})();
</script>
