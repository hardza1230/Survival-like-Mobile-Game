<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#241d2e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/art/entry/kitchen_loader.css?v=6.0.36">
<link rel="preload" as="image" href="assets/art/entry/kitchen_night.webp">
<title>Mochi Mayhem</title>
<style>
  html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#241d2e;
    touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;
    display:block!important;margin:0!important;padding:0!important;touch-action:none;background:#241d2e;
    image-rendering:auto;}
  *{-webkit-tap-highlight-color:transparent;}
  #err-box{position:fixed;bottom:20px;left:20px;right:20px;z-index:10000;display:none;background:rgba(30,15,35,0.95);border:2px solid #ff5a7a;border-radius:14px;padding:16px;color:#fff;font-family:sans-serif;text-align:center;}
  #err-box button{margin-top:10px;padding:8px 16px;background:#66d3b3;border:none;border-radius:8px;font-weight:bold;color:#12331f;cursor:pointer;}
  #game-loader{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(circle at 50% 34%,#5c3a58 0,#33273f 46%,#1d1626 100%);
    color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;transition:opacity .22s ease;}
  #game-loader .card{position:relative;width:min(78vw,360px);text-align:center;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  #game-loader .status{min-height:23px;margin-top:10px;font-size:15px;color:#f5e8f0;}
  #game-loader .track{height:7px;margin-top:16px;padding:0;border-radius:999px;background:#17121e;overflow:hidden;position:relative;
    box-shadow:inset 0 1px 2px #0004,0 0 0 1px #ffffff15;}
  #game-loader .track:after{display:none}
  #game-loader .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#91d9c2,#e8dab4);
    box-shadow:none;transition:width .18s ease;}
  #game-loader .status{white-space:pre-line;}
  #game-loader .percent{margin-top:8px;font-size:13px;font-weight:500;color:#d2c8d8;}
</style>
<script>
  window.GameLoader = {
    _introDone:false,
    _introFinished:false,
    _introTimer:null,
    _revealTimer:null,
    _shownAt:performance.now(),
    finishIntro:function(){
      var root=document.getElementById('game-loader');if(!root)return;
      clearTimeout(this._introTimer);this._introTimer=null;
      root.style.opacity='0';root.style.pointerEvents='none';
      setTimeout(function(){if(root.style.opacity==='0')root.style.display='none';root.classList.remove('opening','intro-mode');},240);
      this._introFinished=true;this.lightOn();if(window.LoaderMusic)window.LoaderMusic.stop();window.dispatchEvent(new Event('mochi-intro-finished'));
    },
    // แสงกลางจอเริ่มโผล่ (48% ของฉากเปิด) → เริ่มเพลงเมนูได้
    lightOn:function(){if(this._lightOn)return;this._lightOn=true;if(window.LoaderMusic)window.LoaderMusic.stop();window.dispatchEvent(new Event('mochi-intro-light'));},
    skipIntro:function(){var root=document.getElementById('game-loader');if(this._introDone&&root&&root.classList.contains('opening'))this.finishIntro();},
    show:function(label,progress){
      var root=document.getElementById('game-loader');
      if(!root)return;
      root.style.display='flex'; root.style.pointerEvents='auto';
      if(!this._shownAt)this._shownAt=performance.now();
      root.classList.toggle('intro-mode',!this._introDone); root.classList.toggle('loading-mode',this._introDone); root.classList.remove('opening');
      requestAnimationFrame(function(){root.style.opacity='1';});
      this.set(progress == null ? 0 : progress,label);
    },
    set:function(progress,label){
      var fill=document.getElementById('load-fill'), pct=document.getElementById('load-percent');
      var status=document.getElementById('load-status');
      var p=Math.max(0,Math.min(1,Number(progress)||0));
      if(fill)fill.style.width=Math.round(p*100)+'%';
      if(pct)pct.textContent=Math.round(p*100)+'%';
      if(status&&label)status.textContent=label;
    },
    hide:function(){
      var root=document.getElementById('game-loader');
      if(!root)return;
      if(!this._introDone && root.classList.contains('intro-mode')){
        this._introDone=true;
        var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var begin=()=>{root.classList.add('opening');this._introTimer=setTimeout(()=>this.finishIntro(),reduced?180:9400);setTimeout(()=>this.lightOn(),reduced?0:4500);};
        // Let the three lamps light in order even when the assets load quickly.
        var remaining=reduced?0:Math.max(0,3300-(performance.now()-(this._shownAt||performance.now())));
        clearTimeout(this._revealTimer);
        this._revealTimer=setTimeout(begin,remaining);
        return;
      }
      root.style.opacity='0'; root.style.pointerEvents='none';
      setTimeout(function(){ if(root.style.opacity==='0')root.style.display='none'; },240);
    }
  };
  // เพลงหน้าโหลด (Fairy Kingdom) — เคารพปิดเสียง/ระดับเพลงในเซฟ · เบราว์เซอร์บล็อก autoplay ได้ → ลองเล่นใหม่ตอนแตะครั้งแรก
  window.LoaderMusic=(function(){var a=null,stopped=false,vol=0.32;
    try{var sv=JSON.parse(localStorage.getItem('mochi_save')||'{}'),st=sv.settings||{};if(st.sound===false)stopped=true;if(st.musicVol!=null)vol*=st.musicVol;}catch(e){}
    function play(){if(stopped)return;try{if(!a){a=new Audio('assets/audio/bgm/menu/bgm_loading_forgotten_wind_lite.mp3');a.loop=true;a.volume=vol;}var p=a.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
    function stop(){if(stopped)return;stopped=true;if(!a)return;var v=a.volume,t=setInterval(function(){v-=0.04;if(v<=0){clearInterval(t);a.pause();}else a.volume=v;},60);}
    play();window.addEventListener('pointerdown',play,{once:true,capture:true});window.addEventListener('touchstart',play,{once:true,capture:true,passive:true});
    return {play:play,stop:stop};})();
  window.addEventListener('error', function(e){
    var box = document.getElementById('err-box');
    var txt = document.getElementById('err-msg');
    if(box && txt){
      box.style.display = 'block';
      txt.textContent = 'เกิดข้อผิดพลาด: ' + (e.message || e);
    }
  });
  window.addEventListener('unhandledrejection',function(e){
    var box=document.getElementById('err-box'), txt=document.getElementById('err-msg');
    if(box&&txt){ box.style.display='block'; txt.textContent='เปิดเกมไม่สำเร็จ: '+((e.reason&&e.reason.message)||e.reason||'กรุณาลองใหม่'); }
  });
  function clearCacheAndReload(){
    if('caches' in window){ caches.keys().then(function(names){ return Promise.all(names.map(function(n){return caches.delete(n);})); }).finally(function(){window.location.reload();}); }
    else window.location.reload();
  }
  window.enterGameFullscreen=function(){
    try{
      var root=document.documentElement;
      if(!document.fullscreenElement&&root.requestFullscreen)root.requestFullscreen({navigationUI:'hide'}).catch(function(){});
      var o=screen.orientation;if(o&&o.lock)o.lock('portrait').catch(function(){});
    }catch(e){}
  };
  window.addEventListener('pointerdown',window.enterGameFullscreen,{once:true,capture:true});
  window.addEventListener('touchstart',window.enterGameFullscreen,{once:true,capture:true,passive:true});
</script>
</head>
<body>
<div id="game-loader" class="intro-mode" role="status" aria-live="polite">
  <div class="kitchen" aria-hidden="true"><div class="k-stage">
    <div class="k-plate"></div><div class="k-clouds"></div>
    <div class="k-lamp a"></div><div class="k-lamp b"></div><div class="k-lamp c"></div><div class="k-warm"></div>
    <div class="k-oven"></div><div class="k-steam"><i style="--sx:11%;--delay:-.2s"></i><i style="--sx:39%;--delay:-1.2s"></i><i style="--sx:67%;--delay:-2.2s"></i></div>
    <div class="k-curtain left"></div><div class="k-curtain right"></div><div class="k-jar-glint"></div>
    <div class="k-motes"></div><div class="k-bloom"></div><div class="k-shade"></div>
  </div>
    <div class="k-world"><div class="k-city"></div><div class="k-flowers"></div>
      <div class="k-petals"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="k-transition-light"></div><div class="k-menu-light"></div>
  </div>
  <button id="entry-skip" type="button" onclick="window.GameLoader.skipIntro()">ข้ามฉากเปิด ›</button>
  <div class="card">
    <div class="status" id="load-status">กำลังเปิดครัวขนม...</div>
    <div class="track"><div class="fill" id="load-fill"></div></div>
    <div class="percent" id="load-percent">0%</div>
  </div>
</div>
<div id="err-box">
  <div id="err-msg">เกิดข้อผิดพลาดในการโหลดเกม</div>
  <button onclick="clearCacheAndReload()">↻ ล้างแคชแล้วโหลดใหม่</button>
</div>
<!-- Supabase JS SDK (cloud save) — โหลดจาก CDN · ถ้าโหลดไม่ได้เกมยังเล่นได้ (เซฟ localStorage) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<script src="phaser.min.js"></script>
<script>
  // โหลด game.js แบบกันแคชค้าง (WebView/Pages เคยเสิร์ฟไฟล์เก่า)
  (function(){
    var s=document.createElement('script');
    s.src='game.js?v='+Date.now();
    s.onerror=function(){ var b=document.getElementById('err-box'); if(b)b.style.display='block'; };
    document.body.appendChild(s);
  })();
</script>
<script>
  (function(){ try{ window.enterGameFullscreen(); }catch(e){} })();
</script>
</body>
</html>
