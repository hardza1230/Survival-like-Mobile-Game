<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#241d2e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Mochi Mayhem</title>
<style>
  html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#241d2e;
    touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  canvas{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;
    display:block!important;margin:0!important;padding:0!important;touch-action:none;background:#241d2e;
    image-rendering:auto;}
  *{-webkit-tap-highlight-color:transparent;}
  #err-box{position:fixed;bottom:20px;left:20px;right:20px;z-index:10000;display:none;background:rgba(30,15,35,0.95);border:2px solid #ff5a7a;border-radius:14px;padding:16px;color:#fff;font-family:sans-serif;text-align:center;}
  #err-box button{margin-top:10px;padding:8px 16px;background:#66d3b3;border:none;border-radius:8px;font-weight:bold;color:#12331f;cursor:pointer;}
  #game-loader{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(circle at 50% 34%,#5c3a58 0,#33273f 46%,#1d1626 100%);
    color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;transition:opacity .22s ease;}
  #game-loader .floaties{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  #game-loader .floaties span{position:absolute;bottom:-10%;font-size:30px;opacity:.5;
    filter:drop-shadow(0 3px 5px #0006);animation:floatUp linear infinite;}
  #game-loader .card{position:relative;width:min(78vw,360px);text-align:center;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  #game-loader .berry{font-size:76px;line-height:1;filter:drop-shadow(0 7px 10px #160d18);
    animation:berryBounce 1.15s ease-in-out infinite;text-shadow:0 0 30px #ff7ba6cc,0 0 60px #ff5a8f66;}
  @keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}
    12%{opacity:.55}88%{opacity:.55}100%{transform:translateY(-118vh) rotate(220deg);opacity:0}}
  #game-loader .title{margin-top:15px;font-size:27px;font-weight:900;color:#ffb5cf;letter-spacing:.3px;}
  #game-loader .status{min-height:23px;margin-top:10px;font-size:15px;color:#f5e8f0;}
  #game-loader .track{height:15px;margin-top:16px;padding:3px;border-radius:999px;background:#17121e;
    box-shadow:inset 0 1px 5px #0008,0 0 0 2px #ffffff18;}
  #game-loader .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff628f,#ffb04c);
    box-shadow:0 0 13px #ff718d99;transition:width .18s ease;}
  #game-loader .percent{margin-top:8px;font-size:13px;font-weight:800;color:#ffd69b;}
  #game-loader .tip{margin-top:22px;font-size:12px;line-height:1.5;color:#ae9fba;}
  #load-retry{display:none;margin:16px auto 0;padding:10px 20px;border:0;border-radius:12px;
    background:#ff85b3;color:#fff;font-size:14px;font-weight:800;box-shadow:0 5px 14px #120b1488;cursor:pointer;}
  @keyframes berryBounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}

  /* Three independent artwork layers: city, split gate, and nearby blossoms. */
  #game-loader .entry{position:absolute;inset:0;overflow:hidden;pointer-events:none;display:none;background:#38243d}
  #game-loader.intro-mode .entry{display:block}
  #game-loader .entry-city,#game-loader .entry-foreground,#game-loader .entry-door,#game-loader .entry-glow{position:absolute;inset:-2%;background-position:center;background-repeat:no-repeat;background-size:cover;will-change:transform,opacity}
  #game-loader .entry-city{background-image:url('assets/art/entry/city.webp');filter:brightness(.55);transform:scale(1.02)}
  #game-loader .entry-foreground{background-image:url('assets/art/entry/foreground.webp');z-index:3}
  #game-loader .entry-door{background-image:url('assets/art/entry/gate.webp');z-index:2;filter:brightness(.78)}
  #game-loader .entry-door.left{clip-path:inset(0 50% 0 0)}
  #game-loader .entry-door.right{clip-path:inset(0 0 0 50%)}
  #game-loader .entry-glow{z-index:1;background:radial-gradient(ellipse at 50% 56%,#fff3d2 0%,#ffd39496 14%,transparent 58%);opacity:0}
  #game-loader .entry-motes{position:absolute;inset:0;z-index:4;opacity:0;background-image:radial-gradient(circle,#fff4cb 1.4px,transparent 2px),radial-gradient(circle,#fff6d6 1px,transparent 2px);background-size:67px 91px,89px 107px;background-position:16px 24px,42px 57px}
  #game-loader.intro-mode .floaties{display:none}
  #game-loader.intro-mode .card{z-index:5;align-self:flex-end;margin-bottom:max(7vh,env(safe-area-inset-bottom));padding:12px 16px;border-radius:18px;background:#25192aba;backdrop-filter:blur(6px)}
  #game-loader.intro-mode .berry,#game-loader.intro-mode .title,#game-loader.intro-mode .tip{display:none}
  #game-loader.opening .card{animation:entry-card-out .35s ease both}
  #game-loader.opening .entry-city{animation:entry-city-in 2.35s ease-in-out both}
  #game-loader.opening .entry-door.left{animation:entry-door-left 2.35s cubic-bezier(.25,.65,.25,1) both}
  #game-loader.opening .entry-door.right{animation:entry-door-right 2.35s cubic-bezier(.25,.65,.25,1) both}
  #game-loader.opening .entry-foreground{animation:entry-near-in 2.35s ease-in both}
  #game-loader.opening .entry-glow{animation:entry-light 2.35s ease-in-out both}
  #game-loader.opening .entry-motes{animation:entry-motes-in 2.35s ease-in-out both}
  @keyframes entry-card-out{to{opacity:0;transform:translateY(15px)}}
  @keyframes entry-city-in{0%{transform:scale(1.02);filter:brightness(.55)}45%{filter:brightness(.96)}100%{transform:scale(1.38);filter:brightness(1)}}
  @keyframes entry-door-left{0%,12%{transform:translateX(0)}53%{transform:translateX(-49%)}100%{transform:translateX(-130%);opacity:0}}
  @keyframes entry-door-right{0%,12%{transform:translateX(0)}53%{transform:translateX(49%)}100%{transform:translateX(130%);opacity:0}}
  @keyframes entry-near-in{0%,40%{transform:scale(1);opacity:1}100%{transform:scale(1.8);opacity:0}}
  @keyframes entry-light{0%,12%{opacity:0}42%{opacity:.88}76%,100%{opacity:0}}
  @keyframes entry-motes-in{0%,14%{opacity:0;transform:scale(.8)}50%{opacity:.85}100%{opacity:0;transform:scale(1.7)}}
  @media(prefers-reduced-motion:reduce){#game-loader.opening .entry-city,#game-loader.opening .entry-door,#game-loader.opening .entry-foreground,#game-loader.opening .entry-glow,#game-loader.opening .entry-motes{animation:none}#game-loader.opening .entry{opacity:0;transition:opacity .15s}}
</style>
<script>
  window.GameLoader = {
    _introDone:false,
    show:function(label,progress){
      var root=document.getElementById('game-loader');
      if(!root)return;
      root.style.display='flex'; root.style.pointerEvents='auto';
      root.classList.toggle('intro-mode',!this._introDone); root.classList.remove('opening');
      requestAnimationFrame(function(){root.style.opacity='1';});
      var retry=document.getElementById('load-retry'); if(retry)retry.style.display='none';
      clearTimeout(this._slowTimer);
      this._slowTimer=setTimeout(function(){
        var status=document.getElementById('load-status'), btn=document.getElementById('load-retry');
        if(status)status.textContent='ใช้เวลานานกว่าปกติ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';
        if(btn)btn.style.display='block';
      },20000);
      this.set(progress == null ? 0 : progress,label);
    },
    set:function(progress,label){
      var fill=document.getElementById('load-fill'), pct=document.getElementById('load-percent');
      var status=document.getElementById('load-status');
      var p=Math.max(0,Math.min(1,Number(progress)||0));
      if(fill)fill.style.width=Math.round(p*100)+'%';
      if(pct)pct.textContent=Math.round(p*100)+'%';
      if(status&&label)status.textContent=label;
    },
    hide:function(){
      var root=document.getElementById('game-loader');
      if(!root)return;
      clearTimeout(this._slowTimer);
      if(!this._introDone && root.classList.contains('intro-mode')){
        this._introDone=true; root.classList.add('opening');
        var duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?180:2350;
        setTimeout(function(){root.style.opacity='0';root.style.pointerEvents='none';
          setTimeout(function(){if(root.style.opacity==='0')root.style.display='none';root.classList.remove('opening','intro-mode');},240);
        },duration);
        return;
      }
      root.style.opacity='0'; root.style.pointerEvents='none';
      setTimeout(function(){ if(root.style.opacity==='0')root.style.display='none'; },240);
    }
  };
  window.addEventListener('error', function(e){
    var box = document.getElementById('err-box');
    var txt = document.getElementById('err-msg');
    if(box && txt){
      box.style.display = 'block';
      txt.textContent = 'เกิดข้อผิดพลาด: ' + (e.message || e);
    }
  });
  window.addEventListener('unhandledrejection',function(e){
    var box=document.getElementById('err-box'), txt=document.getElementById('err-msg');
    if(box&&txt){ box.style.display='block'; txt.textContent='เปิดเกมไม่สำเร็จ: '+((e.reason&&e.reason.message)||e.reason||'กรุณาลองใหม่'); }
  });
  function clearCacheAndReload(){
    if('caches' in window){ caches.keys().then(function(names){ return Promise.all(names.map(function(n){return caches.delete(n);})); }).finally(function(){window.location.reload();}); }
    else window.location.reload();
  }
  window.enterGameFullscreen=function(){
    try{
      var root=document.documentElement;
      if(!document.fullscreenElement&&root.requestFullscreen)root.requestFullscreen({navigationUI:'hide'}).catch(function(){});
      var o=screen.orientation;if(o&&o.lock)o.lock('portrait').catch(function(){});
    }catch(e){}
  };
  window.addEventListener('pointerdown',window.enterGameFullscreen,{once:true,capture:true});
  window.addEventListener('touchstart',window.enterGameFullscreen,{once:true,capture:true,passive:true});
</script>
</head>
<body>
<div id="game-loader" class="intro-mode" role="status" aria-live="polite">
  <div class="entry" aria-hidden="true"><div class="entry-city"></div><div class="entry-glow"></div><div class="entry-door left"></div><div class="entry-door right"></div><div class="entry-foreground"></div><div class="entry-motes"></div></div>
  <div class="floaties" aria-hidden="true">
    <span style="left:8%;animation-duration:9s;animation-delay:0s">🍬</span>
    <span style="left:22%;animation-duration:12s;animation-delay:2s">🍭</span>
    <span style="left:38%;animation-duration:10s;animation-delay:4s">🧁</span>
    <span style="left:54%;animation-duration:13s;animation-delay:1s">🍩</span>
    <span style="left:70%;animation-duration:8.5s;animation-delay:3s">🍡</span>
    <span style="left:86%;animation-duration:11s;animation-delay:5s">🍬</span>
    <span style="left:15%;animation-duration:14s;animation-delay:6.5s">🍫</span>
    <span style="left:63%;animation-duration:9.5s;animation-delay:7s">🍭</span>
  </div>
  <div class="card">
    <div class="berry">🍓</div>
    <div class="title">Mochi Mayhem</div>
    <div class="status" id="load-status">กำลังเปิดครัวขนม...</div>
    <div class="track"><div class="fill" id="load-fill"></div></div>
    <div class="percent" id="load-percent">0%</div>
    <div class="tip">ครั้งแรกอาจใช้เวลาสักครู่<br>เกมกำลังเตรียมภาพ เสียง และตัวละคร</div>
    <button id="load-retry" onclick="clearCacheAndReload()">↻ ลองโหลดใหม่</button>
  </div>
</div>
<div id="err-box">
  <div id="err-msg">เกิดข้อผิดพลาดในการโหลดเกม</div>
  <button onclick="clearCacheAndReload()">↻ ล้างแคชแล้วโหลดใหม่</button>
</div>
<!-- Supabase JS SDK (cloud save) — โหลดจาก CDN · ถ้าโหลดไม่ได้เกมยังเล่นได้ (เซฟ localStorage) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="phaser.min.js"></script>
<script>
  // โหลด game.js แบบกันแคชค้าง (WebView/Pages เคยเสิร์ฟไฟล์เก่า)
  (function(){
    var s=document.createElement('script');
    s.src='game.js?v='+Date.now();
    s.onerror=function(){ var b=document.getElementById('err-box'); if(b)b.style.display='block'; };
    document.body.appendChild(s);
  })();
</script>
<script>
  (function(){ try{ window.enterGameFullscreen(); }catch(e){} })();
</script>
</body>
</html>
