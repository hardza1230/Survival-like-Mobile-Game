<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mochi Mayhem</title>
<style>
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#241d2e;
    touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  canvas{display:block;touch-action:none;}
  *{-webkit-tap-highlight-color:transparent;}
  #rotate{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:#241d2e;color:#ffd9a8;
    font-family:sans-serif;text-align:center;padding:24px;}
  #rotate .ico{font-size:64px;animation:rk 1.6s ease-in-out infinite;}
  #rotate .t{font-size:20px;font-weight:bold;color:#ff8fb5;}
  #rotate .s{font-size:14px;color:#c7bdd6;}
  #rotate .btn-bypass{margin-top:14px;padding:10px 20px;background:#ff85b3;color:#fff;border-radius:12px;border:none;font-weight:bold;font-size:14px;cursor:pointer;}
  @keyframes rk{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
  @media (orientation:landscape) and (max-height: 500px){ #rotate{display:flex;} canvas{visibility:hidden;} }
  #err-box{position:fixed;bottom:20px;left:20px;right:20px;z-index:10000;display:none;background:rgba(30,15,35,0.95);border:2px solid #ff5a7a;border-radius:14px;padding:16px;color:#fff;font-family:sans-serif;text-align:center;}
  #err-box button{margin-top:10px;padding:8px 16px;background:#66d3b3;border:none;border-radius:8px;font-weight:bold;color:#12331f;cursor:pointer;}
</style>
<script>
  window.addEventListener('error', function(e){
    var box = document.getElementById('err-box');
    var txt = document.getElementById('err-msg');
    if(box && txt){
      box.style.display = 'block';
      txt.textContent = 'เกิดข้อผิดพลาด: ' + (e.message || e);
    }
  });
  function clearCacheAndReload(){
    try { localStorage.removeItem('mochi_save'); } catch(e){}
    if('caches' in window){ caches.keys().then(function(names){ for(var n of names) caches.delete(n); }); }
    window.location.reload(true);
  }
</script>
</head>
<body>
<div id="rotate">
  <div class="ico">📱</div>
  <div class="t">หมุนจอเป็นแนวตั้ง</div>
  <div class="s">Mochi Mayhem เล่นในแนวตั้ง (Portrait) เท่านั้น</div>
  <button class="btn-bypass" onclick="document.getElementById('rotate').style.display='none';">เล่นต่อ</button>
</div>
<div id="err-box">
  <div id="err-msg">เกิดข้อผิดพลาดในการโหลดเกม</div>
  <button onclick="clearCacheAndReload()">↻ ล้างแคชแล้วโหลดใหม่</button>
</div>
<script src="phaser.min.js"></script>
<script src="game.js"></script>
<script>
  (function(){ try{ var o=screen.orientation; if(o&&o.lock)o.lock('portrait').catch(function(){}); }catch(e){} })();
</script>
</body>
</html>
